name: Deploy FarmPulse to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Ensure workers.dev subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2addc1ce7db4af91c9067ee2a8bba7f0
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          current_response="$(curl --silent --show-error --fail-with-body \
            --url "${endpoint}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          current_subdomain="$(node -e 'const result = JSON.parse(process.argv[1]); console.log(result.result?.subdomain ?? "");' "$current_response")"

          if [ -z "$current_subdomain" ]; then
            create_response="$(curl --silent --show-error --fail-with-body \
              --request PUT \
              --url "${endpoint}" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data '{"subdomain":"farmpulse-aodxx-th"}')"
            node -e 'const result = JSON.parse(process.argv[1]); if (!result.success) { console.error(result.errors); process.exit(1); }' "$create_response"
          else
            echo "Using existing workers.dev subdomain: ${current_subdomain}"
          fi

      - name: Deploy Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2addc1ce7db4af91c9067ee2a8bba7f0
