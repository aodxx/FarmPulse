name: Deploy FarmPulse to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Verify D1 migrations locally
        run: |
          npm run db:local
          npm run db:verify:local

      - name: Ensure D1 database and binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2addc1ce7db4af91c9067ee2a8bba7f0
        run: |
          set -euo pipefail
          databases="$(npx wrangler d1 list --json)"
          database_id="$(node -e '
            const databases = JSON.parse(process.argv[1]);
            const database = databases.find((item) => item.name === "farmpulse-db");
            console.log(database?.uuid ?? database?.id ?? "");
          ' "$databases")"

          if [ -z "$database_id" ]; then
            npx wrangler d1 create farmpulse-db --location apac
            databases="$(npx wrangler d1 list --json)"
            database_id="$(node -e '
              const databases = JSON.parse(process.argv[1]);
              const database = databases.find((item) => item.name === "farmpulse-db");
              console.log(database?.uuid ?? database?.id ?? "");
            ' "$databases")"
          fi

          if [ -z "$database_id" ]; then
            echo "Unable to resolve farmpulse-db database ID" >&2
            exit 1
          fi

          node scripts/configure-d1.mjs "$database_id"
          echo "D1 database ready: farmpulse-db"

      - name: Apply D1 migrations
        run: npm run db:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2addc1ce7db4af91c9067ee2a8bba7f0

      - name: Verify remote D1 schema
        run: |
          result="$(npx wrangler d1 execute DB --remote --json --command="SELECT COUNT(*) AS table_count FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'")"
          node -e '
            const payload = JSON.parse(process.argv[1]);
            const count = payload[0]?.results?.[0]?.table_count ?? 0;
            if (count < 14) throw new Error(`Expected at least 14 application tables, found ${count}`);
            console.log(`Verified ${count} D1 application tables.`);
          ' "$result"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2addc1ce7db4af91c9067ee2a8bba7f0

      - name: Deploy Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2addc1ce7db4af91c9067ee2a8bba7f0

      - name: Verify production health
        run: |
          curl --silent --show-error --fail-with-body \
            https://farmpulse.farmpulse-aodxx-th.workers.dev/api/health
          curl --silent --show-error --fail-with-body \
            https://farmpulse.farmpulse-aodxx-th.workers.dev/api/db/health

          auth_status="$(curl --silent --show-error --fail-with-body \
            https://farmpulse.farmpulse-aodxx-th.workers.dev/api/auth/status)"
          node -e '
            const status = JSON.parse(process.argv[1]);
            if (!status.ok || status.authenticated !== false) {
              throw new Error("Unexpected public auth status");
            }
            console.log("Verified public auth status.");
          ' "$auth_status"

          anonymous_code="$(curl --silent --output /tmp/farmpulse-anonymous.json \
            --write-out "%{http_code}" \
            https://farmpulse.farmpulse-aodxx-th.workers.dev/api/farms)"
          if [ "$anonymous_code" != "401" ]; then
            cat /tmp/farmpulse-anonymous.json
            echo "Expected anonymous farm request to return 401, received $anonymous_code" >&2
            exit 1
          fi
          echo "Verified anonymous farm data is protected."

          curl --silent --show-error --fail-with-body \
            https://farmpulse.farmpulse-aodxx-th.workers.dev/manifest.webmanifest >/dev/null
