name = "farmpulse"
main = "src/index.ts"
compatibility_date = "2026-09-01"
account_id = "793f6dc7afb275fb3d03c869b1570a1a"

[vars]
APP_NAME = "FarmPulse"
APP_VERSION = "0.1.0"
ENVIRONMENT = "production"

# Cloudflare agent tracing / Workers tracing.
# Agent activity will appear alongside Worker runtime operations in Cloudflare Observability.
[observability.traces]
enabled = true

# Bindings are added after Cloudflare resources are created.
# Example:
# [[d1_databases]]
# binding = "DB"
# database_name = "farmpulse-db"
# database_id = "REPLACE_AFTER_CREATION"
#
# [[r2_buckets]]
# binding = "ATTACHMENTS"
# bucket_name = "farmpulse-attachments"
#
# [triggers]
# crons = ["0 */3 * * *"]
